name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "ai-software-company/web/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# Deploy static SPA to branch `gh-pages` (Settings → Pages → Deploy from a branch → gh-pages / root)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-software-company/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-software-company/web/package-lock.json

      - name: Install & build
        env:
          # Project site: https://<owner>.github.io/CRM_premium/
          VITE_BASE: /CRM_premium/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm ci
          npm run build
          # SPA deep-link fallback for GitHub Pages (refresh on client routes)
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ai-software-company/web/dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
